# Installed at /etc/systemd/system/user@.service.d/90-no-oomd-pressure.conf by
# grant-claude-diagnostics.sh.
#
# Ubuntu ships user@.service with ManagedOOMMemoryPressure=kill at a 50% limit: when a user's
# whole session spends more than half its time stalled on memory for 20 s, systemd-oomd kills
# the descendant cgroup with the most reclaim - which is always a dev container, whole, with every
# Claude session and tmux server inside it. It did so five times (2026-07-24, 07-25, 09-07 twice,
# 09-27 08:15 "79.81% > 50.00% for > 20s"), acting before the kernel reached the per-container
# --memory cap, where only the single largest process dies (as it did correctly for a 6.3 GB resvg
# and three 4-6 GB greps). A user cannot exempt its own slice (ManagedOOMPreference is honored only
# on root-owned cgroups), so the pressure kill is turned off for user sessions here, and the
# containers' own caps (launch-container.sh: 10G each, 12G over all of them) do the job.
#
# What this costs: oomd no longer rescues a desktop thrashing from something OUTSIDE the
# containers. With this in place oomd acts on nothing at all on this host: Ubuntu 22.04's
# -.slice drop-in (10-oomd-root-slice-defaults.conf) sets ManagedOOMSwap=auto, so there was never
# a swap-based kill (`oomctl dump` after the change: both monitored lists empty, measured
# 2026-09-28). The kernel's OOM killer, the per-container caps and the 12G slice ceiling remain.
# GM decision, 2026-09-28.
[Service]
ManagedOOMMemoryPressure=auto
