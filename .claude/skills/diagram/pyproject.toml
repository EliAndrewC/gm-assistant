# Lint + format + type + test + coverage config for the diagram skill's Python.
# One gate command runs them all: `make done` -> ruff check + ruff format --check + mypy + pytest
# (100% coverage). Wired so Constitution Principle X is enforced for the whole skill, not missed.
#
# Principle X (feature 005, GM-directed 2026-07-13): the Mode B engine (settlement.py,
# check_village.py, waterfields.py) is brought to FULL compliance - no grace period. ruff lint +
# format apply now; mypy --strict is reached via a per-module ratchet (the three engine modules are
# relaxed via [[tool.mypy.overrides]] below and annotated to strict in focused per-module passes,
# each pass removing its module from the override so the gate blocks backsliding). pack_audit.py
# (feature 007) stays strict-typed + linted.

# ---- ruff (lint + format) ----------------------------------------------------------------
[tool.ruff]
target-version = "py314"
# The engine uses intentionally long, descriptive single-line check calls; 200 keeps `ruff format`
# from wrapping them (only ~17 lines exceed it) while still normalizing spacing/comments.
line-length = 200
extend-exclude = ["pool"]   # generated per-map gens are scripts, formatted by their own authors

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # long descriptive lines are house style; the formatter caps wrapping via line-length

[tool.ruff.lint.per-file-ignores]
# the package __init__ re-exports the consumed legacy `import check_village` surface via star
# imports (feature 027, superseding 024's verbatim roster): F403 because the stars ARE the
# re-export mechanism there, F401 for the aliased explicit block
"check_village/__init__.py" = ["F401", "F403"]
# same rationale for the settlement package split (feature 025)
"settlement/__init__.py" = ["F401"]
# same star-import re-export mechanism for the waterfields package split (feature 110)
"waterfields/__init__.py" = ["F401", "F403"]
# same again for the hamletgen package split (feature 111), plus E402: this __init__ runs a
# sys.path bootstrap BEFORE its imports, because every submodule imports `settlement` and
# `waterfields` by absolute name and the package must work when run from anywhere
"hamletgen/__init__.py" = ["E402", "F401", "F403"]

[tool.ruff.format]
# Preserve the existing quote style: the SVG f-strings use single-outer/double-inner
# (f'<rect fill="{c}"/>'), so leaving quotes as-authored avoids needless churn/risk.
quote-style = "preserve"

# ---- mypy (strict, with a per-module ratchet) --------------------------------------------
# Scoped to PRODUCTION LIBRARY modules (per Principle X - not the tests or the generator scripts).
# `python3 -m mypy` (bare, in the Makefile) checks exactly these files.
[tool.mypy]
python_version = "3.14"
strict = true
files = ["settlement", "check_village", "waterfields", "hamletgen", "pack_audit.py", "compound.py", "citybudget.py", "why_placed.py", "scatter_audit.py", "timings.py", "pool_index.py", "poolmaps.py"]

# RATCHET FULLY RETIRED: all three legacy engine modules (waterfields.py, check_village.py,
# settlement.py) have been migrated to mypy --strict and the per-module override that relaxed them is
# gone, so the gate now blocks any backsliding across the whole Mode B engine. NEW modules are strict
# from the start via `files` above. (History: the manifest is an untyped dict, so the engine carried
# ~2,470 pre-existing strict errors; they were cleared module-by-module in focused behavior-preserving
# passes, each verified by byte-identical map output + the full gate still passing on every pool map.)

# ---- pytest + coverage -------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "--cov --cov-report=term"

[tool.coverage.run]
source = ["check_village", "settlement", "pack_audit", "compound", "citybudget", "render_cache", "site_justice", "scatter_audit", "hamletgen", "pool_index", "poolmaps"]
omit = ["test_*.py", "pool/*/*.gen.py"]

# COVERAGE ENFORCEMENT LIVES IN THE MAKEFILE since the 2026-08-16 legacy freeze, not here. The
# hand-authored pool maps are frozen and their gens never run, so the above-hamlet wings of
# settlement.py (towns, cities, the capital) are exercised by nothing until those tiers convert to
# scripted generation. A single global `fail_under = 100` therefore cannot hold; the Makefile's
# `test` target enforces 100% on every module EXCEPT settlement.py and a RATCHET floor on
# settlement.py (raise it as tiers convert - see the comment there). `show_missing` stays off so
# settlement.py's known hole does not print a screen of line ranges on every run; for the module
# you are editing, `python3 -m coverage report -m --include='*/<file>'` after a suite run, and a
# failed gate still prints exactly the changed-but-uncovered lines via uncovered-in-diff.py.
[tool.coverage.report]
show_missing = false
exclude_also = [
    "if __name__ == .__main__.:",   # script entry guards are exercised via the CLI, not unit tests
]
