# Shrine builder catalog, group "grounds". See ../catalog.yaml for the format and the rules.
key: grounds
label: The grounds
intro: >-
  How the place is marked off from the forest, and what a visitor passes on the way in.
categories:
  - key: gate_form
    label: Gate
    prompt: What marks the threshold of the sacred ground?
    reference: myojin
    options:
      - key: trees
        label: Two trees bound with rope
        text: >-
          Two great trees on either side of the path are joined by a sacred rope hung with paper
          streamers.
        appeal: >-
          The forest itself makes the gate, and passing between living trunks feels like being
          admitted by them.
        units: 0
        lines: [{contract: rites, koku: 0.12}]
      - key: shinmei
        label: Straight gate
        ja: 神明鳥居
        romaji: shinmei torii
        text: >-
          Two round posts and two straight crossbeams, nothing more.
        appeal: >-
          The oldest form of torii, the shrine gate, stark and serene, it frames the path like a
          brushstroke.
        units: 1
        gloss: >-
          "Divine light gate." The oldest, plainest shrine gate, with straight crossbeams.
      - key: myojin
        label: Upswept gate
        ja: 明神鳥居
        romaji: myojin torii
        text: >-
          A top beam that curves up at the ends like a bow, over a straight tie beam, with a plaque
          bearing the shrine's name between them.
        appeal: >-
          Among the most common gates.
        units: 1.2
        gloss: >-
          "Bright deity gate." A shrine gate whose top beam curves upward at the ends.
      - key: row
        label: A tunnel of small gates
        text: >-
          Small torii set close together along the path so it runs through them like a tunnel.
        appeal: >-
          Each gate is a thank-offering from someone whose prayer was answered, so the tunnel grows
          longer over the years, a visible record of the shrine's favors.
        units: 2

  - key: gate_material
    label: Gate material
    prompt: What is the gate made of?
    when: {gate_form: {not: [trees]}}
    reference: vermilion
    options:
      - key: wood
        label: Bare wood
        text: >-
          Timber left its own color, renewed every generation as the posts weather.
        appeal: >-
          Quiet and of a piece with the forest, it seems to have grown where it stands.
        lines: [{contract: carpentry, koku: 1.18, per: gate_form}]
      - key: vermilion
        label: Vermilion-painted wood
        text: >-
          Timber painted vermilion, the red-orange long held to ward off evil and to preserve the
          wood.
        appeal: >-
          The color shows through the trees long before the shrine does, a promise of what lies
          ahead.
        lines: [{contract: carpentry, koku: 1.18, per: gate_form}, {contract: finishing, koku: 0.53, per: gate_form}]
      - key: stone
        label: Stone
        text: >-
          Cut granite, gray and permanent, often given by a patron whose name is carved on a
          post.
        appeal: >-
          It will stand unchanged for a thousand years, a monument in its own right.
        lines: [{contract: stonework, koku: 4.9, heavy: 8, per: gate_form}]

  - key: path
    label: Approach path
    prompt: What is the approach (sando) to the shrine like?
    reference: stepping
    options:
      - key: earth
        label: Swept earth
        text: >-
          A cleared path of beaten earth, swept by those who tend it, with roots for steps.
        appeal: >-
          The path stays as the forest made it, and every visitor walks it as the first visitor did.
        lines: [{contract: earthwork, koku: 0.1}]
      - key: gravel
        label: White gravel
        text: >-
          Raked pale gravel, which crunches underfoot.
        appeal: >-
          Walking on it is itself a small purification, and the sound announces every visitor.
        lines: [{contract: earthwork, koku: 0.4, heavy: 3}]
      - key: stepping
        label: Stepping stones
        text: >-
          Flat stones set in moss a stride apart, leading through the trees.
        appeal: >-
          They set an unhurried pace, so visitors arrive calm and attentive.
        lines: [{contract: stonework, koku: 0.62, heavy: 4}]
      - key: steps
        label: Stone stairway
        text: >-
          A flight of cut stone steps climbing to the shrine.
        appeal: >-
          The shrine is always approached from below and seen against the sky, and the climb
          itself becomes an act of devotion.
        lines: [{contract: stonework, koku: 3.94, heavy: 8}]

  - key: enclosure
    label: Enclosure
    prompt: What marks the sacred ground around the sanctuary?
    reference: fence
    options:
      - key: none
        label: The forest itself
        text: >-
          The trees stand close around the sanctuary and are its boundary; moss and roots mark
          where the sacred ground begins.
        appeal: >-
          The shrine seems to have grown out of the woods rather than been placed in them.
      - key: rope
        label: Sacred rope
        ja: 注連縄
        romaji: shimenawa
        text: >-
          A twisted rice-straw rope hung with zigzag paper streamers (shide), strung between
          posts or trees around the sacred ground and renewed each year.
        appeal: >-
          Its white streamers stir in every breeze, and the yearly renewal gives the shrine's
          keepers a festival day.
        lines: [{contract: rites, koku: 0.12}]
        gloss: >-
          A twisted rice-straw rope that marks off sacred ground, hung with zigzag paper streamers.
      - key: fence
        label: Low wooden fence
        ja: 玉垣
        romaji: tamagaki
        text: >-
          A knee-high fence of square posts and rails around the sanctuary.
        appeal: >-
          It says plainly where the sacred ground begins, and gives the space a tended, orderly
          calm.
        lines: [{contract: carpentry, koku: 0.9}]
        gloss: >-
          "Jewel fence." The low fence around a sanctuary.
      - key: posts
        label: Stone posts
        text: >-
          Squat stone posts linked by stone or iron rails.
        appeal: >-
          Donors' names can be carved on them one family to a post, binding the villages to the
          shrine for generations.
        lines: [{contract: stonework, koku: 1.62, heavy: 5}]
      - key: hedge
        label: Sakaki hedge
        ja: 榊
        romaji: sakaki
        text: >-
          A planted hedge of sakaki, the glossy evergreen whose branches are offered at every
          rite.
        appeal: >-
          Living, and it grows thicker every year, a boundary that renews itself.
        lines: [{contract: earthwork, koku: 0.22}]

        gloss: >-
          Sakaki, a glossy evergreen held sacred; its branches are offered in rites.
  - key: guardians
    label: Guardians
    prompt: What guards the shrine?
    reference: foxes
    options:
      - key: none
        label: The forest itself
        text: >-
          The old trees and the creatures that live among them keep the shrine, coming and going at
          their own pace.
        appeal: >-
          Its guardians are the living creatures of the place, with no carving between the shrine
          and its forest.
        wording:
          memorial:
            appeal: >-
              Its guardians are the living creatures of the place, which suits a shrine to one whose
              life was bound up with them - for Shoda, the foxes he died defending.
      - key: komainu
        label: Stone lion-dogs
        ja: 狛犬
        romaji: komainu
        text: >-
          A pair of stone lion-dogs on pedestals, one with its mouth open to say 'a' and one closed
          to say 'un', the first and last sounds of the sacred syllabary, standing for the beginning
          and end of all things.
        appeal: >-
          Perhaps the most common guardians of all.
        lines: [{contract: stonework, koku: 4.45, heavy: 8}]
        gloss: >-
          "Korean dogs." Paired guardian lion-dogs that flank the approach to a shrine.
      - key: foxes
        label: Stone foxes
        ja: 狐
        romaji: kitsune
        text: >-
          A pair of stone foxes, messengers of Inari, Fortune of rice and of foxes, one holding a
          jewel and one a key or a scroll in its mouth.
        appeal: >-
          Fitting wherever foxes are honored or Inari's favor is sought, and visitors dress them in
          red bibs in thanks for favors granted.
        lines: [{contract: stonework, koku: 4.78, heavy: 8}]
        gloss: >-
          "Fox." Foxes are the messengers of Inari, Fortune of rice and of foxes.
      - key: wooden
        label: Carved wooden guardians
        text: >-
          A small pair of carved and painted wooden lion-dogs that sit on the sanctuary's porch,
          out of the weather.
        appeal: >-
          The oldest form, from before guardians moved outdoors, and their painted faces reward
          anyone who comes close.
        lines: [{contract: finishing, koku: 1.75}]

  - key: lanterns
    label: Light
    prompt: How is the path lit?
    reference: pair
    options:
      - key: none
        label: A clearing open to the sky
        text: >-
          The canopy is opened above the path and the sanctuary, so sunlight falls on them by
          day and moonlight by night.
        appeal: >-
          On a full-moon night the whole shrine stands silver in the dark forest.
        lines: [{contract: earthwork, koku: 0.36}]
      - key: pair
        label: A pair of stone lanterns
        ja: 石灯籠
        romaji: ishidoro
        text: >-
          Two stone lanterns flanking the path, each a firebox on a tall shaft.
        appeal: >-
          Lit for festivals and night visits, they turn the approach into a ceremony.
        lines: [{contract: stonework, koku: 2.3, heavy: 6}]
        gloss: >-
          "Stone lantern." A lantern of carved stone, a firebox on a tall shaft.
      - key: tall
        label: One tall night-lantern
        ja: 常夜灯
        romaji: joyato
        text: >-
          A single tall stone lantern at the foot of the path, lit whenever someone tends the shrine
          or keeps a night vigil there.
        appeal: >-
          Standing tall at the foot of the path, it marks the way in from far off, and on a lit
          night it can be seen through the trees.
        lines: [{contract: stonework, koku: 1.98, heavy: 5}]
        gloss: >-
          "Always-night light." A tall lantern meant to burn through the night as a beacon.
      - key: hanging
        label: Hanging metal lanterns
        when: {form: {not: [himorogi]}}
        ja: 釣灯籠
        romaji: tsuridoro
        text: >-
          Two pierced bronze or iron lanterns hung from the sanctuary's eaves, lighting the last
          steps of the path.
        appeal: >-
          They throw patterned light across the steps, like stars caught in the shrine.
        lines: [{contract: metalwork, koku: 1.25}]

        gloss: >-
          "Hanging lantern." A pierced metal lantern hung from eaves or a beam.
  - key: water
    label: Purification water
    prompt: Where do visitors rinse their hands and mouths before approaching?
    reference: basin
    options:
      - key: stream
        label: The stream
        text: >-
          Visitors kneel at the edge of a nearby stream and purify themselves in its current.
        appeal: >-
          Running water is the purest of all, and no vessel stands between the visitor and it.
        lines: [{contract: earthwork, koku: 0.05}]
        wording:
          memorial:
            appeal: >-
              Running water is the purest of all, and a stream the dead knew in life is a fitting
              place to make oneself clean before calling on them.
      - key: basin
        label: Stone basin with a bamboo spout
        ja: 手水鉢
        romaji: chozubachi
        text: >-
          A carved stone basin fed by a bamboo pipe from a spring, with a long-handled dipper
          resting across it.
        appeal: >-
          The water never stops running, and its trickle is the first sound a visitor hears.
        lines: [{contract: stonework, koku: 1.18, heavy: 4}, {contract: carpentry, koku: 0.07}]
        gloss: >-
          "Hand-water bowl." A stone basin of water for rinsing the hands and mouth before praying.
      - key: pavilion
        label: Basin under a roofed pavilion
        ja: 手水舎
        romaji: temizuya
        text: >-
          A small open-sided pavilion on four posts over a long stone trough, with a rack of dippers
          along its edge.
        appeal: >-
          It gives shelter from rain and snow and a dry place to pause on the climb.
        lines: [{contract: stonework, koku: 1.18, heavy: 4}, {contract: carpentry, koku: 1.82}, {contract: roofing, koku: 0.42}]

        gloss: >-
          "Hand-water house." A small roofed shelter over the purification water.