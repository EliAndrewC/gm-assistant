# Shrine builder catalog, group "dedication". See ../catalog.yaml for the format and the rules.
key: dedication
label: Name and dedication
intro: >-
  How the shrine is named, how its story is told to those who come after, and how the kami is
  invited to dwell in it.
wording:
  memorial:
    intro: >-
      How the shrine is named, how its story is told to those who come after, and how the spirit of
      the dead is called to it.
  fortune:
    intro: >-
      How the shrine is named, how its story is told to those who come after, and how the Fortune
      is called to the shrine.
categories:
  - key: plaque
    label: The name
    prompt: How is the shrine's name shown?
    reference: painted
    options:
      - key: none
        label: A name-stone by the path
        ja: 社号標
        romaji: shagohyo
        text: >-
          A squared stone pillar at the foot of the path, the shrine's name cut deep into its
          face.
        appeal: >-
          It greets travelers before they reach the trees, and will read clearly in a hundred
          years.
        lines: [{contract: stonework, koku: 3, heavy: 3}]
        gloss: >-
          "Shrine-name marker." A stone pillar carved with the shrine's name, set where the approach
          begins.
      - key: painted
        label: A painted wooden plaque
        ja: 扁額
        romaji: hengaku
        text: >-
          The shrine's name brushed by a local hand, then carved and painted on a wooden tablet over
          the gate or the shrine's front.
        appeal: >-
          It hangs where every visitor passes beneath the name.
        lines: [{contract: finishing, koku: 1}]
        gloss: >-
          "Framed plaque." A tablet bearing a name, hung high over a gate or a doorway.
      - key: calligrapher
        label: Calligraphy by a noted master
        text: >-
          The name written by a calligrapher of reputation, then carved and gilded on a plaque over
          the gate or the shrine's front.
        appeal: >-
          Visitors who know brushwork will recognize the hand and stop to admire it.
        lines: [{contract: finishing, koku: 6}]
      - key: patron
        label: In the founder's own hand
        text: >-
          The name written by the person who commissioned the shrine, and carved from their
          brushwork on a plaque over the gate or the shrine's front.
        appeal: >-
          Whatever the hand, it is theirs, and it ties the founder to the shrine forever.
        lines: [{contract: finishing, koku: 0.5}]

  - key: stele
    label: Telling the story
    prompt: How is the shrine's story kept?
    reference: stele
    options:
      - key: none
        label: Told by those who tend it
        text: >-
          Those who tend the shrine recount its story to whoever they find there, and teach it to
          those who come after.
        appeal: >-
          The story lives in the telling, and grows a little with every teller.
      - key: stele
        label: An inscribed stone
        ja: 石碑
        romaji: sekihi
        text: >-
          An upright stone carved with the shrine's story and the names of those who founded it.
        appeal: >-
          It will outlast everyone involved, and the founders' names with it.
        lines: [{contract: stonework, koku: 6, heavy: 5}]
        gloss: >-
          "Stone monument." An upright stone carved with an inscription.
      - key: board
        label: A board telling the origin story
        ja: 縁起
        romaji: engi
        text: >-
          The shrine's origin story brushed on a wooden board under a little roof, repainted when it
          fades.
        appeal: >-
          Each repainting is a chance to retell the story, so it never grows stale.
        lines: [{contract: carpentry, koku: 1}, {contract: finishing, koku: 0.5}]

        gloss: >-
          "Origins." A shrine's founding story, told on a board, a scroll or a stone.
  - key: rite
    label: Consecration
    prompt: How is the kami invited into the shrine?
    wording:
      memorial:
        prompt: How is the shrine consecrated?
      fortune:
        prompt: >-
          How is the Fortune called to the shrine?
    reference: full
    options:
      - key: monk
        label: A dedication by the country monk
        text: >-
          The district's country monk comes out, purifies the ground, says the words and seals the
          sacred object chosen for the shrine into place.
        wording:
          memorial:
            text: >-
              The district's country monk comes out, purifies the ground, says the words and calls
              the spirit of the dead to the shrine.
            appeal: >-
              A rite among the locals who will keep the shrine, led by a monk they trust.
        appeal: >-
          A rite performed by the monk who already tends the district's shrines, among the locals
          who will keep this one.
        lines: [{contract: rites, koku: 1}]
      - key: full
        label: A night enshrinement
        text: >-
          Priests come out from the county's shrine for a night rite: the sacred object chosen for
          the shrine is carried in darkness, behind white curtains, to drums and the calling-out of
          the kami.
        appeal: >-
          Those who witness it never forget the moment the kami arrives in the dark.
        wording:
          memorial:
            text: >-
              Priests come out from the county's shrine for a night rite in darkness, behind white
              curtains, to drums and the calling-out of the spirit.
            appeal: >-
              Those who witness it never forget the moment the spirit answers the call in the dark.
          fortune:
            text: >-
              Priests come out from the county's shrine for a night rite: the sacred object chosen
              for the shrine is carried in darkness, behind white curtains, to drums and the
              calling-out of the Fortune.
            appeal: >-
              Those who witness it never forget the moment the Fortune is called in the dark.
        lines: [{contract: rites, koku: 4}]
      - key: festival
        label: A pacification festival
        text: >-
          A day of music, dance and offerings, with food for the villages nearby; the kami is
          installed at its height.
        wording:
          memorial:
            text: >-
              A day of music, dance and offerings, with food for the villages nearby; the spirit of
              the dead is called to the shrine at its height.
            appeal: >-
              Held to calm a spirit that met a hard end so that it may rest and bear no grudge, and
              the villages will remember the day for years.
          fortune:
            text: >-
              A day of music, dance and offerings, with food for the villages nearby; the Fortune
              is called down at its height.
            appeal: >-
              The villages will remember the day for years, and a Fortune welcomed with joy is
              thought to look kindly on those who welcomed it.
            label: A festival of welcome
        appeal: >-
          A spirit welcomed with music and offerings is well disposed toward the place, and the
          villages will remember the day for years.
        lines: [{contract: rites, koku: 10}]
