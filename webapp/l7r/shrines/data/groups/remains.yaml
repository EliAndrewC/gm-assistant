# Shrine builder catalog, group "remains". See ../catalog.yaml for the format and the rules.
# Every step here applies only to a memorial (`when: {kind: [memorial]}`), and the options are
# written generically ("the dead", "their"); Shoda (the first use) appears only as an example.
key: remains
label: The remains
intro: >-
  Monks, and the burakumin who handle the dead, bring the remains out from wherever they were first
  laid - for Shoda, a pauper's mound, and the salt in which his head was kept. What is done with
  them after that is for the founder to decide.
categories:
  - key: heart
    label: The heart of the shrine
    prompt: What lies at the heart of the shrine, and who keeps its rites?
    when: {kind: [memorial]}
    reference: registered
    # FR-032/FR-033: the human dead are honored ancestors, not kami, and whether they are entered
    # on the Ministry of Rites' rolls is part of this same question (GM 2026-10-17).
    options:
      - key: registered
        label: Their spirit, honored as an ancestor and registered
        text: >-
          The spirit of the dead is honored here as an ancestor - called to the shrine by its rites,
          as honored ancestors are called home at Obon - and entered on the rolls of the domain's
          Ministry of Rites. The remains rest apart in a tomb of their own.
        appeal: >-
          The dead are honored with the full weight of the Empire's rites behind them, and no one
          can say the shrine is anything less than proper.
        lines: [{contract: rites, koku: 2.75}]
      - key: disciples
        label: Their spirit, honored by those who knew them
        text: >-
          The spirit of the dead is honored here as an ancestor by those who knew them and those
          who come, without asking any ministry's leave; the remains rest apart in a tomb of their
          own.
        appeal: >-
          The rites stay in the hands of those who knew the dead, with no priest sent from outside
          to keep them.
      - key: bones
        label: The remains themselves
        text: >-
          The remains themselves are the heart of the shrine, as halls are raised over the relics of
          revered priests; visitors pray before the bones rather than before a spirit called by
          rites, and those who come keep what rites there are.
        appeal: >-
          Every visitor prays in the presence of what is left of the dead.

  - key: preparation
    label: Preparing the remains
    prompt: How are the remains prepared once they are brought out?
    when: {kind: [memorial]}
    decides: >-
      Burned or buried, what is left is more than clean bone, and how the bones are prepared
      decides whether any of them can later be shown to visitors.
    reference: washed
    options:
      - key: washed
        label: Washed clean
        ja: 洗骨
        romaji: senkotsu
        text: >-
          Whatever still clings to the bones - ash from a pyre or the earth of the grave - is taken
          off by hand, and each bone is washed in sake until it is white.
        appeal: >-
          The dead are made clean of the death they were given, and go to their rest as white and
          whole as their bones allow.
        lines: [{contract: remains, koku: 0.34}, {contract: rites, koku: 0.2}]
        gloss: >-
          "Washing the bones." A second funeral in which bones are taken up after the first burial
          or burning, cleaned by hand and washed, then laid in a vessel.
      - key: wrapped
        label: Laid to rest as they are
        text: >-
          The remains are lifted as they lie, with the ash and earth around them, and wrapped in
          white cloth with incense; the bones themselves are never picked clean or washed.
        appeal: >-
          The dead are disturbed as little as possible, and every trace of them leaves the place
          they were first laid.
        lines: [{contract: remains, koku: 0.28}]

  - key: sharing
    label: Dividing the remains
    prompt: How are the remains kept - together, or divided?
    when: {kind: [memorial]}
    # FR-044: several may be chosen; "together" excludes the rest (`exclusive`).
    multi: true
    reference: together
    # FR-034: the head is part of this question, not a step of its own. A head is treated apart
    # only when it was severed (the dead of battle, a bounty, a trophy), hence the "if".
    options:
      - key: together
        label: Kept together
        exclusive: true
        text: >-
          Every bone that can be recovered - and the head, if it was severed and kept - is laid to
          rest together at the shrine.
        appeal: >-
          The dead are made whole again, and the shrine keeps all of them.
      - key: headmound
        label: The head under a mound of its own
        ja: 首塚
        romaji: kubizuka
        text: >-
          Where the head was severed - as for a bounty or a trophy - it is buried apart under its
          own mound and stone within the shrine grounds, as the heads of those who died by violence
          have long been buried.
        appeal: >-
          Long held the surest way to calm a spirit that met a hard end, and a second place for
          those who honor the dead to pray.
        lines: [{contract: earthwork, koku: 0.25}, {contract: stonework, koku: 0.37, heavy: 2}, {contract: rites, koku: 0.2}]
        gloss: >-
          "Head mound." A mound raised over a head buried apart from its body - most often the heads
          of warriors or the executed, buried with rites to quiet the spirit.
      - key: temple
        label: A portion to a temple they were connected to
        ja: 分骨
        romaji: bunkotsu
        text: >-
          A bone, or the head, is given to a temple the dead were connected to - for Shoda, the
          Temple of Ebisu that sheltered him - as great men's remains have been divided among the
          temples that honored them.
        appeal: >-
          The temple shares in their rest, and the two places are bound together through them.
        lines: [{contract: rites, koku: 2}]
        gloss: >-
          "Dividing the bones." Sending part of someone's remains to rest in a second place, so that
          more than one temple or grave honors them.
      - key: mountain
        label: A portion to a mountain temple
        text: >-
          A portion of the bones is carried to a great temple on a holy mountain, where the faithful
          send a part of their dead to rest near the great holy men buried there.
        appeal: >-
          Some part of the dead rests among the holiest dead of the Empire.
        lines: [{contract: rites, koku: 2.75}]

  - key: resting
    label: Storing the remains
    prompt: What holds the remains, and where does it rest?
    when: {kind: [memorial]}
    reference: gorinto
    options:
      - key: inner
        label: A stone coffer in the innermost precinct
        when: {heart: {not: [bones]}}
        ja: 奥の院
        romaji: oku-no-in
        text: >-
          The remains are sealed in a stone coffer in a tomb set apart behind the sanctuary and above
          it - the shrine's innermost precinct - reached by a flight of steps through the trees.
        appeal: >-
          Visitors climb to the dead last, as to the innermost place of the shrine.
        lines: [{contract: stonework, koku: 2.5, heavy: 6}, {contract: earthwork, koku: 0.27}]
        gloss: >-
          "The inner precinct." The deepest and holiest part of a sacred site, often set apart and
          above the rest and reached last.
      - key: gorinto
        label: An urn beneath a five-ring pagoda
        ja: 五輪塔
        romaji: gorinto
        text: >-
          A glazed urn buried beneath a stone pagoda of five stacked shapes - earth, water, fire,
          air and void.
        appeal: >-
          The five elements stand over the dead, and the pagoda's quiet silhouette reads at once as
          a holy grave.
        lines: [{contract: stonework, koku: 2.5, heavy: 5}]
        gloss: >-
          "Five-ring tower." A stone grave marker of five stacked shapes - cube, sphere, pyramid,
          crescent and jewel - for earth, water, fire, air and void.
      - key: hall
        label: A lacquered chest in a mortuary hall
        ja: 霊屋
        romaji: tamaya
        text: >-
          The remains lie in a lacquered chest on a dais inside a small hall of their own, closed
          with doors.
        appeal: >-
          The dead are given a house of their own, a place where those who come can kneel out of
          the rain.
        lines: [{contract: carpentry, koku: 7.05}, {contract: roofing, koku: 1.32}, {contract: finishing, koku: 1.7}]
        gloss: >-
          "Spirit house." A small hall built over or around someone's remains or memorial tablet, a
          house for the honored dead.
      - key: mound
        label: A clay jar under an earthen mound
        ja: 塚
        romaji: tsuka
        text: >-
          The remains go into an unglazed clay jar, and those who honor the dead heap a mound of
          earth over it with their own hands, crowned with a single stone.
        appeal: >-
          The oldest kind of grave there is, raised by hand.
        lines: [{contract: earthwork, koku: 0.31}]

        gloss: >-
          "Mound." A heap of earth raised over something buried, from a simple grave to a great
          tomb.
  - key: display
    label: Showing the remains
    prompt: How are the remains shown to those who come?
    when: {kind: [memorial]}
    reference: sealed
    options:
      - key: sealed
        label: Sealed, and left in peace
        text: >-
          The remains are sealed in their resting place and not shown; visitors pray before the
          place, not the bones.
        appeal: >-
          One of the most common ways to keep the dead.
      - key: reliquary
        label: One bone in a reliquary
        ja: 舎利塔
        romaji: sharito
        when: {preparation: [washed]}
        text: >-
          A single washed bone is kept apart in a small pagoda-shaped reliquary with crystal sides,
          shown to visitors on festival days, as the relics of revered priests are shown.
        appeal: >-
          Those who come on those days see the dead with their own eyes, and the festival gains a
          heart.
        lines: [{contract: metalwork, koku: 1.43}]
        gloss: >-
          "Relic tower." A small pagoda-shaped vessel made to hold, and often to show, relics - the
          bones or ashes of a revered person.
      - key: kaicho
        label: Unveiled on rare days
        ja: 開帳
        romaji: kaicho
        text: >-
          The vessel holding the remains is kept closed, and opened to view only on rare appointed
          days, when people come from far around to see it.
        appeal: >-
          Rarity draws pilgrims, and each day of unveiling becomes an event in its own right.
        lines: [{contract: rites, koku: 0.35}]
        gloss: >-
          "Opening the curtain." The custom of unveiling hidden sacred things to the public only
          on rare, appointed occasions.
      - key: lattice
        label: The chest behind a lattice door
        when: {resting: [hall]}
        text: >-
          The lacquered chest that holds the remains stands behind a latticed door, so that anyone
          who kneels can see where the dead lie, though the chest is never opened.
        appeal: >-
          The dead are always present to anyone who kneels and looks, yet always at rest.
        lines: [{contract: carpentry, koku: 0.28}]
