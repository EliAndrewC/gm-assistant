# Shrine builder catalog, group "sanctuary". See ../catalog.yaml for the format and the rules.
key: sanctuary
label: The sanctuary
intro: >-
  The sanctuary (honden) is the heart of the shrine, the house of the kami, whether it stands alone
  or among other buildings. Nobody goes inside it; its doors are opened only for rites.
wording:
  memorial:
    intro: >-
      The sanctuary (honden) is the heart of the shrine, the house that keeps what is most sacred -
      here, the place the honored dead are called to, or their remains - whether it stands alone or
      among other buildings. Nobody goes inside it; its doors are opened only for rites.
  fortune:
    intro: >-
      The sanctuary (honden) is the heart of the shrine, the seat to which the Fortune is called,
      whether it stands alone or among other buildings. Nobody goes inside it; its doors are opened
      only for rites.
categories:
  - key: form
    label: Form
    prompt: What form does the sanctuary take?
    reference: nagare
    options:
      - key: nagare
        label: Flowing roof
        ja: 流造
        romaji: nagare-zukuri
        text: >-
          A gabled roof whose front slope runs long and low over the steps, so that worshipers stand
          under the eaves.
        appeal: >-
          Perhaps the most common form in the Empire.
        lines: [{contract: carpentry, koku: 16}]
        gloss: >-
          "Flowing style." A sanctuary whose front roof slope sweeps down long and low over the
          steps.
      - key: kasuga
        label: Gable-entry
        ja: 春日造
        romaji: kasuga-zukuri
        text: >-
          A compact box entered from the gable end under a small curved porch roof, neat and
          upright, and often painted vermilion.
        appeal: >-
          It has the poise of a jewel box set down among the trees, and draws the eye straight
          to its doors.
        lines: [{contract: carpentry, koku: 15}]
        gloss: >-
          "Kasuga style," named for a great old shrine: a small sanctuary entered from its gable end
          under a curved porch.
      - key: shinmei
        label: Straight roof on posts
        ja: 神明造
        romaji: shinmei-zukuri
        text: >-
          One of the oldest building forms: a raised storehouse shape with a straight, unbent roof,
          round pillars sunk in the earth and crossed finials at the ridge.
        appeal: >-
          Severe and archaic, it makes the shrine feel as if it has stood in the forest since the
          age of the gods.
        lines: [{contract: carpentry, koku: 14}]
        gloss: >-
          "Divine light style." The ancient straight-roofed form, raised like a storehouse, with
          crossed finials at the ridge.
      - key: hokora
        label: Stone shrine-house
        ja: 祠
        romaji: hokora
        text: >-
          A small house of carved stone, chest high, on a stone plinth, the kind found along
          roadsides and in groves all over the countryside.
        appeal: >-
          Moss and lichen claim it within a few years, and it will still be standing when every
          timber in the province has rotted away.
        lines: [{contract: stonework, koku: 6, heavy: 4}]
        gloss: >-
          A small shrine-house, in wood or stone, set by roads, on hills and in groves.
      - key: himorogi
        label: Open to the sky
        ja: 神籬
        romaji: himorogi
        text: >-
          The kami is called not into a house but down into a space under the open sky, bound with
          sacred rope and purified.
        wording:
          memorial:
            text: >-
              The heart of the shrine is left open to the forest and the sky, its ground bound
              with sacred rope and purified.
            appeal: >-
              The most ancient form of worship, and the closest of all to a life lived in the open.
          fortune:
            text: >-
              The Fortune is called not to a house but to the living forest itself, to a place
              bound with sacred rope and purified, under the open sky.
        appeal: >-
          The most ancient form of worship, still kept at some of the greatest shrines in the
          Empire.
        lines: [{contract: carpentry, koku: 1}]

        gloss: >-
          "Sacred fence." A space under the open sky, marked off and purified, into which a divine
          presence is called - worship from before there were buildings.
  - key: dwelling
    label: The kami's dwelling
    prompt: What does the kami dwell in?
    wording:
      memorial:
        label: Where the spirit is called
        prompt: Where is the spirit of the dead called to?
      fortune:
        label: >-
          Where the Fortune is called
        prompt: >-
          Where is the Fortune called to?
    when: {form: [himorogi], heart: {not: [bones]}}
    reference: tree
    options:
      - key: tree
        label: A great tree
        ja: 神木
        romaji: shinboku
        text: >-
          The oldest tree in the grove, its trunk bound with a thick straw rope and paper streamers.
        appeal: >-
          A living pillar between earth and heaven, it will keep growing for centuries, and every
          visitor finds themselves looking up.
        lines: [{contract: earthwork, koku: 0.5}, {contract: rites, koku: 0.5}]
        gloss: >-
          "Divine tree." A tree held sacred, usually old and great, bound with a straw rope to mark
          it.
      - key: rock
        label: A rock seat
        ja: 磐座
        romaji: iwakura
        text: >-
          A great boulder long held to be a seat of the divine, ringed with rope and swept clean.
        appeal: >-
          The kami of this place is honored on a seat of stone older than any building, and those
          who come can sit before it.
        wording:
          memorial:
            appeal: >-
              The spirit is called to a seat the dead knew in life, and those who knew them can sit
              before it as they once did.
            text: >-
              A boulder the dead knew in life, ringed with rope and swept clean - for Shoda, the
              stone where he sat to teach.
          fortune:
            appeal: >-
              The Fortune is called to a seat of stone that has known this place for ages, and
              those who come can sit before it.
        lines: [{contract: earthwork, koku: 0.5}]
        gloss: >-
          "Rock seat." A great boulder held to be a seat for a divine presence.
      - key: standing
        label: A standing stone
        ja: 立石
        romaji: tateishi
        text: >-
          A tall stone raised upright at the heart of the clearing, rough and unworked.
        appeal: >-
          It reads from far off as a figure waiting among the trees, and holds the morning light
          on its face.
        lines: [{contract: stonework, koku: 3, heavy: 3}]
        gloss: >-
          "Standing stone." A stone raised upright to mark a holy place.
      - key: grove
        label: The whole grove
        ja: 神奈備
        romaji: kannabi
        text: >-
          The entire grove is held to be the kami's body, its edges marked with rope.
        wording:
          memorial:
            text: >-
              The entire grove is where the spirit is called, its edges marked with rope.
          fortune:
            text: >-
              The entire grove is where the Fortune is called, its edges marked with rope.
        appeal: >-
          Every step taken among those trees is a step inside the shrine, and the forest itself
          becomes the holy place.
        lines: [{contract: rites, koku: 1}]

        gloss: >-
          A mountain or grove held to be itself the body or home of a divine presence.
  - key: ground
    label: The ground before it
    prompt: How is the ground at the heart of the shrine laid?
    wording:
      memorial:
        prompt: How is the ground at the heart of the shrine laid?
      fortune:
        prompt: How is the ground where the Fortune is called laid?
    when: {form: [himorogi]}
    reference: gravel
    options:
      - key: gravel
        label: A court of white gravel
        text: >-
          A level court of pale gravel, raked in lines, spread before the shrine's heart for rites.
        appeal: >-
          It glows in moonlight, and the sound of each footstep tells the kami someone has come.
        wording:
          memorial:
            appeal: >-
              It glows in moonlight, and the sound of each footstep tells the dead that someone has
              come.
          fortune:
            appeal: >-
              It glows in moonlight, and the sound of each footstep tells the Fortune someone has
              come.
        lines: [{contract: earthwork, koku: 2, heavy: 3}]
      - key: moss
        label: Moss left to grow
        text: >-
          The forest floor is cleared of brush and left to the moss, which the keepers tend by hand.
        appeal: >-
          Soft and green as velvet, it hushes every step and makes the place feel untouched.
        lines: [{contract: earthwork, koku: 0.5}]
      - key: bamboo
        label: Four green bamboo and a rope
        ja: 斎竹
        romaji: imidake
        text: >-
          Four freshly cut green bamboo stand at the corners of a square, joined by a sacred rope
          hung with paper streamers.
        appeal: >-
          The oldest way of marking ground for a kami to descend into, and renewing the bamboo each
          year gives the keepers a rite of their own.
        wording:
          memorial:
            appeal: >-
              The oldest way of marking holy ground, and renewing the bamboo each year gives the
              keepers a rite of their own.
          fortune:
            appeal: >-
              The oldest way of marking ground for the divine to descend into, and renewing the
              bamboo each year gives the keepers a rite of their own.
        lines: [{contract: rites, koku: 0.5}]
        gloss: >-
          "Purifying bamboo." Four fresh bamboo set at the corners of a square and joined by sacred
          rope, marking ground made pure for a rite.
      - key: stones
        label: A ring of river stones
        text: >-
          Smooth stones carried up from a nearby stream and set in a circle around the shrine's
          heart.
        appeal: >-
          The stream is brought to the heart of the shrine stone by stone, and the stones keep the
          cool of running water.
        lines: [{contract: earthwork, koku: 1.5, heavy: 2}]

  - key: timber
    label: Timber
    prompt: What wood is it built from?
    when: {form: {not: [hokora, himorogi]}}
    reference: hinoki
    options:
      - key: sugi
        label: Cedar from the shrine's own woods
        ja: 杉
        romaji: sugi
        text: >-
          Trees felled from the shrine's own woods and sawn on the spot: straight, reddish and soft.
        appeal: >-
          The shrine is made of the very trees that stand around it, and belongs to its ground as
          they do.
        lines: [{contract: carpentry, koku: 2}]
        gloss: >-
          Japanese cedar, a tall straight forest tree with reddish, soft, fragrant wood.
      - key: hinoki
        label: Hinoki cypress
        ja: 檜
        romaji: hinoki
        text: >-
          Pale, close-grained and fragrant, brought in from elsewhere; it weathers to silver and
          resists rot.
        appeal: >-
          The timber most associated with shrines, and its clean scent greets every visitor at
          the steps.
        lines: [{contract: carpentry, koku: 8, heavy: 4}]
        gloss: >-
          Japanese cypress, the pale, fine-grained, fragrant wood most prized for shrines.
      - key: keyaki
        label: Zelkova
        ja: 欅
        romaji: keyaki
        text: >-
          A hard, dense hardwood with a strong figure that darkens with age, brought in from
          elsewhere.
        appeal: >-
          It holds a carved edge for centuries and gives the building a dark, formal weight.
        lines: [{contract: carpentry, koku: 10, heavy: 4}]

        gloss: >-
          Zelkova, a hard hardwood with a bold grain, favored for heavy beams and carving.
  - key: roof
    label: Roof covering
    prompt: What is the roof made of?
    when: {form: {not: [hokora, himorogi]}}
    reference: hiwada
    options:
      - key: thatch
        label: Thatch
        ja: 茅葺
        romaji: kayabuki
        text: >-
          Thick bundles of reed and grass, soft-edged and deep; the keepers can rethatch it
          themselves every twenty years or so.
        appeal: >-
          The oldest roof there is, and under snow it looks like part of the hillside.
        lines: [{contract: roofing, koku: 3}]
        gloss: >-
          "Grass-roofed." A roof of thick bundled reeds and grasses.
      - key: kokera
        label: Wooden shingles
        ja: 杮葺
        romaji: kokerabuki
        text: >-
          Thin hand-split boards laid in many overlapping courses, giving crisp, finely ribbed
          lines.
        appeal: >-
          Light and precise, it shows off the carpenter's eye in every course.
        lines: [{contract: roofing, koku: 5}]
        gloss: >-
          "Shingle-roofed." A roof of thin split wooden shingles laid in many courses.
      - key: hiwada
        label: Cypress bark
        ja: 檜皮葺
        romaji: hiwadabuki
        text: >-
          Layer upon layer of bark stripped from living cypress, pressed into smooth, dark,
          sweeping curves.
        appeal: >-
          The classic roof of courtly shrines, its curves seem to flow down like water.
        lines: [{contract: roofing, koku: 8}]
        gloss: >-
          "Cypress-bark roofed." A roof of layered bark stripped from living cypress trees.
      - key: copper
        label: Copper sheet
        ja: 銅板葺
        romaji: dobanbuki
        text: >-
          Copper plates seamed over boards: bright as a polished mirror at first, then brown, and
          finally blue-green.
        appeal: >-
          That green is the mark of an old shrine, and it outlasts every other roof by
          generations.
        lines: [{contract: roofing, koku: 22, heavy: 1}]

        gloss: >-
          "Copper-plate roofed." A roof of copper sheets, which weather from bright to brown to
          blue-green.
  - key: finish
    label: Finish
    prompt: How is the wood finished?
    when: {form: {not: [hokora, himorogi]}}
    reference: shiraki
    options:
      - key: shiraki
        label: Bare wood
        ja: 白木
        romaji: shiraki
        text: >-
          The wood as the carpenter left it, going silver-gray in the weather and showing every
          line of its grain.
        appeal: >-
          The purest finish in the old view, honest to the forest it came from.
        gloss: >-
          "White wood." Wood left bare, without paint or lacquer.
      - key: kakishibu
        label: Persimmon stain
        ja: 柿渋
        romaji: kakishibu
        text: >-
          Fermented persimmon juice brushed on and darkened in the sun to a warm brown that sheds
          rain and keeps insects off.
        appeal: >-
          A deep country warmth, like old farmhouse beams glowing in lamplight.
        lines: [{contract: finishing, koku: 1}]
        gloss: >-
          "Persimmon tannin." Juice of unripe persimmons, fermented and brushed on to stain and
          protect wood.
      - key: vermilion
        label: Vermilion
        ja: 丹塗
        romaji: ninuri
        text: >-
          The red-orange of shrine gates, said to ward off evil and to preserve the wood.
        appeal: >-
          Strongly associated with Inari, the Fortune of rice and of foxes, it flares through the
          green like a signal fire.
        lines: [{contract: finishing, koku: 5}]
        gloss: >-
          "Cinnabar coat." The red-orange paint of shrine gates and halls.
      - key: lacquer
        label: Black lacquer
        ja: 漆
        romaji: urushi
        text: >-
          Lacquer built up coat by coat to a deep, glossy black.
        appeal: >-
          Dark among dark trees, it gleams like still water whenever a lantern or a shaft of sun
          catches it.
        lines: [{contract: finishing, koku: 8}]

        gloss: >-
          Lacquer from the sap of the lacquer tree, built up in many thin coats to a hard gloss.
  - key: carving
    label: Ornament
    prompt: How are the beams and transoms worked?
    when: {form: {not: [hokora, himorogi]}}
    reference: accents
    options:
      - key: plain
        label: Exposed joinery
        text: >-
          Squared posts and beams fitted without a nail, every joint left in view.
        appeal: >-
          The carpenter's craft is the ornament, and those who know joinery will linger over it.
      - key: accents
        label: Gable pendant and carved beam ends
        ja: 懸魚
        romaji: gegyo
        text: >-
          A carved pendant hangs from the gable peak and the beam ends are shaped into curling
          clouds or animal heads (kibana).
        appeal: >-
          One of the most common types of decoration.
        lines: [{contract: finishing, koku: 5}]
        gloss: >-
          "Hanging fish." The carved board hung beneath a gable peak; old belief held it guarded the
          building from fire.
      - key: lattice
        label: Openwork lattice transoms
        ja: 欄間
        romaji: ranma
        text: >-
          The transoms above the doors are filled with geometric latticework, so light and air
          pass through.
        appeal: >-
          The sanctuary seems to breathe, and at dawn it casts patterned light across the steps.
        lines: [{contract: finishing, koku: 8}]
        gloss: >-
          "Between the beams." The openwork panel in the space above a door or between rooms.
      - key: panels
        label: Relief panels
        text: >-
          The transoms are carved in relief with scenes from the legend of the place and its kami.
        appeal: >-
          Visitors stop to read them like a story, and children are told the tale panel by panel.
        lines: [{contract: finishing, koku: 20}]
        wording:

          fortune:
            text: >-
              The transoms are carved in relief with scenes from the tales of the Fortune.
          memorial:
            text: >-
              The transoms are carved in relief with scenes from the life and death of the one
              honored here - for Shoda, foxes among autumn grasses and a hermit under a tree.