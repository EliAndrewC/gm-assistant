# channel markers through the rocky shallows - budgets.md's "monopoly of an
# irreplaceable local competence", which makes rotating an outsider governor
# through the province too expensive.  A settled interior-facing domain that
# fought no war on its own soil lands in the "1" bucket.
[[etsuko]]
kunisaki = Uminari province

[mention_bots]
# Which bot holds the gateway connection for the mention responder. A Discord
# APPLICATION ID is public - it appears in every invite URL and in this app's own
# OAuth login link - so it belongs here rather than in the secrets file, where a
# security test rightly flagged it as a credential leaking into rendered HTML.
# The TOKENS stay in [mention_bots] of development-secrets.ini.
listener = 1509288141985415300

[lookup]
# Feature 218, the /look-up Discord command (l7r/lookup/). The model is chosen by
# the evaluation in specs/218-lookup-command/ (the cheapest tier within 5 points
# of the best); change it here, not in code. The key is NOT here: it is
# [lookup] gemini_api_key in development-secrets.ini, a key dedicated to the bot.
model = gemini-3.1-flash-lite
# The character-sheet gaming groups that are playing the Wasp campaign.
campaign_groups = Monday Group, Tuesday Group
# A safeguard the session added (raised with the GM): stop calling Gemini for the
# rest of the day once this many dollars have been spent.
daily_ceiling_usd = 1.00
timeout_seconds = 30
# The Discord servers where scripts/register_lookup_command.py registers it: the
# live L7R server and the Robot Role Call scratch server (a guild command shows
# only in the servers it is registered in).
guild_ids = 745421621829042297, 1543009570157236274

[lookup_models]
# The lowest thinking setting each model accepts, probed 2026-10-17
# (specs/218-lookup-command/research.md): none | budget0 | minimal | low | ...
gemini-3.1-flash-lite = none
gemini-3.5-flash-lite = minimal
gemini-3.8-flash = budget0
gemini-3.1-pro-preview = low

[lookup_prices]
# US dollars per million tokens: input, cached input, output (thinking bills as
# output). Checked 2026-10-17; sources in specs/218-lookup-command/research.md.
gemini-3.1-flash-lite = 0.25, 0.025, 1.50
gemini-3.5-flash-lite = 0.30, 0.03, 2.50
gemini-3.8-flash = 0.75, 0.075, 3.75
gemini-3.1-pro-preview = 2.00, 0.20, 12.00
